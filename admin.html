<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Poison Theory</title>
  <link rel="icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="grain">

  <div class="admin-login">
    <div class="admin-login-card" data-aos="zoom-in">
      <div class="admin-login-logo">
        <img src="assets/logo.png" alt="Poison Theory" />
      </div>
      <h1>Lab Access</h1>
      <p>Staff credentials required.</p>

      <form id="loginForm" class="admin-login-form">
        <input type="text" id="loginUser" placeholder="Username" required autocomplete="username" />
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary" id="loginBtn">Enter the Lab →</button>
        <p class="admin-login-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
